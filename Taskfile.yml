version: '3'

silent: true

vars:
  RUN: '{{.ROOT_DIR}}/scripts/run.sh'

includes:
  sops:
    taskfile: ./.taskfiles/sops.yml
    dir: .
  tofu:
    taskfile: ./.taskfiles/tofu
    dir: .
  packer:
    taskfile: ./.taskfiles/packer
    dir: .
  pve:
    taskfile: ./.taskfiles/pve.yml
    dir: .
  gateway:
    taskfile: ./.taskfiles/gateway.yml
    dir: .
  tailscale:
    taskfile: ./.taskfiles/tailscale.yml
    dir: .
  # From ci-runner pipelines/<tool>/lint; CI runs the same tasks.
  tofu:lint:
    taskfile: ./.taskfiles/tofu/lint
    dir: .
  packer:lint:
    taskfile: ./.taskfiles/packer/lint
    dir: .
  ansible:lint:
    taskfile: ./.taskfiles/ansible/lint
    dir: .

tasks:
  default:
    desc: Pick a task to run from an interactive menu.
    interactive: true
    cmds:
      - |
        TASK=$(task --list --silent | grep -v '^default$' | gum filter --placeholder "Pick a task...") || exit 0
        task "$TASK"

  lint:
    desc: Run every lint step CI runs, with live output.
    cmds:
      - '{{.RUN}} "Checking OpenTofu formatting" task tofu:lint:fmt'
      - '{{.RUN}} "Running tflint" task tofu:lint:tflint'
      - '{{.RUN}} "Validating OpenTofu" task tofu:lint:validate'
      - '{{.RUN}} "Checking Packer formatting" task packer:lint:fmt'
      - '{{.RUN}} "Validating Packer" task packer:lint:validate'
      - '{{.RUN}} "Running ansible-lint" task ansible:lint'
      - '{{.RUN}} "Auditing GitHub Actions workflows" task actions:lint'
      - '{{.RUN}} "Decrypting secrets" task sops:check'
      - '{{.RUN}} "Scanning for leaked secrets" task leaks'

  actions:lint:
    desc: Audit the GitHub Actions workflows for security issues with zizmor.
    cmds:
      - zizmor --offline .github/workflows

  leaks:
    desc: Scan the working tree and git history for plaintext secrets.
    cmds:
      - gitleaks git --no-banner --redact .
      - gitleaks dir --no-banner --redact .

  tools:
    desc: Print the version of every pinned tool.
    cmds:
      - tofu version | head -1
      - tflint --version | head -1
      - packer version | head -1
      - ansible --version | head -1
      - ansible-lint --version | head -1
      - sops --version | head -1
      - age --version
      - gitleaks version
      - zizmor --version
      - task --version
      - gum --version
      - yq --version
