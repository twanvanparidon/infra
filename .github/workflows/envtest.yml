# Temporary: proves a job outside main cannot read the proxmox-apply write token.
# Removed before merge.
name: envtest

on:
  pull_request:
    paths:
      - ".github/workflows/envtest.yml"

permissions:
  contents: read

jobs:
  write-token:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deployment: [true, false]
    environment:
      name: proxmox-apply
      deployment: ${{ matrix.deployment }}
    steps:
      - run: if [ -n "$TOKEN" ]; then echo "write token readable"; else echo "write token empty"; fi
        env:
          TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
