# Check every tofu stack for drift: `tofu plan -detailed-exitcode` exits 2 when
# the real infrastructure no longer matches the code and state, which fails the job.
# Locally: `task tofu:plan STACK=<name> -- -detailed-exitcode`.

name: drift

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Every job runs as the hosted runner's user (owns the workspace) instead of root.

jobs:
  stacks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/tofu:1.0.0@sha256:5e620e4267934b60f790bbadc201fcb42adbbf8e33e086dda74237d76365ebd4
      options: --user 1001:1001
    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stacks
        run: echo "stacks=$(task tofu:stacks)" >> "$GITHUB_OUTPUT"

  drift:
    needs: stacks
    if: needs.stacks.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/tofu:1.0.0@sha256:5e620e4267934b60f790bbadc201fcb42adbbf8e33e086dda74237d76365ebd4
      options: --user 1001:1001
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.stacks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: task tofu:plan STACK="$STACK" -- -detailed-exitcode
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TF_CLI_ARGS: -no-color
          STACK: ${{ matrix.stack }}
