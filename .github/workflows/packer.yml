# Build and test Packer images; on main and every week, publish them as GitHub
# releases and keep the newest 3. Pull requests build and test without publishing.
# Locally: `task packer:build` and `task packer:test`.

name: packer

on:
  pull_request:
    paths:
      - "packer/**"
      - ".taskfiles/packer/Taskfile.yml"
      - "devbox.json"
      - "devbox.lock"
      - ".github/workflows/packer.yml"
  push:
    branches: [main]
    paths:
      - "packer/**"
      - ".taskfiles/packer/Taskfile.yml"
      - ".github/workflows/packer.yml"
  # Weekly, to pick up Debian security updates.
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

# A new push to a PR cancels its running build; runs on main never cancel.
concurrency:
  group: packer-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # No ci-runner image ships QEMU; devbox installs the same pinned tools as on a
  # laptop, straight on the runner VM, which has KVM.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Give the runner user access to KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: 0.18.4
          enable-cache: true
      - run: devbox run -- task packer:build
        env:
          # packer init downloads plugins from GitHub; unauthenticated it hits rate limits.
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
      - run: devbox run -- task packer:test
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian-base
          path: packer/debian-base/output-*/*.qcow2
          retention-days: 1
          if-no-files-found: error
          # qcow2 is compressed already.
          compression-level: 0

  # Only this job can write releases; it gets the image the build job tested.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One publish at a time, so two builds on one day get distinct tags.
    concurrency:
      group: packer-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debian-base
          # Where the tasks look for a build.
          path: packer/debian-base/output-ci
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: 0.18.4
          enable-cache: true
      - run: devbox run -- task packer:publish
        env:
          GH_TOKEN: ${{ github.token }}
      - run: devbox run -- task packer:prune
        env:
          GH_TOKEN: ${{ github.token }}
