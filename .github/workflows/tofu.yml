# Plan every tofu stack a pull request changes and post the plan as a PR comment;
# apply every stack a push to main changes and commit its encrypted state back.
# Each step is a task in .taskfiles/tofu; locally: `task tofu:plan STACK=<name>`.

name: tofu

on:
  pull_request:
    paths:
      - "tofu/**"
      - "secrets/tofu.sops.yaml"
      - "secrets/proxmox.sops.yaml"
      - ".taskfiles/tofu/Taskfile.yml"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "tofu/**"
      - "secrets/tofu.sops.yaml"
      - "secrets/proxmox.sops.yaml"
      - ".taskfiles/tofu/Taskfile.yml"
      - ".github/workflows/tofu.yml"

permissions:
  contents: read

# A new push to a PR cancels its running plan; runs on main never cancel.
concurrency:
  group: tofu-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run as the hosted runner's user (owns the workspace) instead of root, except
# those that reach Proxmox: they join the tailnet first, which needs root.

jobs:
  changes:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/twanvanparidon/ci-runner/tofu:1.0.0@sha256:5e620e4267934b60f790bbadc201fcb42adbbf8e33e086dda74237d76365ebd4
      options: --user 1001:1001
    outputs:
      stacks: ${{ steps.changed.outputs.stacks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        run: echo "stacks=$(task tofu:changed BASE="$BASE")" >> "$GITHUB_OUTPUT"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

  plan:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    # Read-only: the dev token comes from sops. No deployment record per plan.
    environment:
      name: proxmox-plan
      deployment: false
    container:
      image: ghcr.io/twanvanparidon/ci-runner/tofu:1.0.0@sha256:5e620e4267934b60f790bbadc201fcb42adbbf8e33e086dda74237d76365ebd4
      # Root, NET_ADMIN and the TUN device let tailscaled create tailscale0.
      options: --user 0:0 --cap-add=NET_ADMIN --device=/dev/net/tun
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: task tailscale:up
        env:
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      # Keep the output for the comment, then fail the step if the plan failed.
      - id: plan
        run: |
          task tofu:plan STACK="$STACK" > plan.txt 2>&1
          rc=$?
          cat plan.txt
          exit $rc
        shell: sh {0}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TF_CLI_ARGS: -no-color
          STACK: ${{ matrix.stack }}
      # One comment per stack, updated on every push.
      - if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STACK: ${{ matrix.stack }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const { STACK, OUTCOME } = process.env;
            const marker = `<!-- tofu-plan:${STACK} -->`;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = '...\n' + plan.slice(-60000);
            const body = [
              marker,
              `### \`tofu plan\` for \`${STACK}\`: ${OUTCOME}`,
              `Commit ${context.payload.pull_request.head.sha.slice(0, 7)}`,
              '```',
              plan,
              '```',
            ].join('\n');
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const old = comments.find((c) => c.body.startsWith(marker));
            if (old) {
              await github.rest.issues.updateComment({ ...issue, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
      - if: always()
        run: task tailscale:down

  apply:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    # Holds the CI write token; only jobs on main may use it.
    environment: proxmox-apply
    container:
      image: ghcr.io/twanvanparidon/ci-runner/tofu:1.0.0@sha256:5e620e4267934b60f790bbadc201fcb42adbbf8e33e086dda74237d76365ebd4
      # Root, NET_ADMIN and the TUN device let tailscaled create tailscale0.
      options: --user 0:0 --cap-add=NET_ADMIN --device=/dev/net/tun
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    # The lock: one apply per stack at a time. A newer queued run replaces an older
    # queued one, which is safe because it applies the newer main.
    concurrency:
      group: tofu-apply-${{ matrix.stack }}
      cancel-in-progress: false
    steps:
      # The latest main, so the state includes commits from earlier applies.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # zizmor: ignore[artipacked] this job pushes the state commit.
        with:
          ref: main
      - run: task tailscale:up
        env:
          TS_CLIENT_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      - id: apply
        run: task tofu:apply STACK="$STACK"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
          STACK: ${{ matrix.stack }}
      # Also after a failed apply: the state then holds what was created.
      # Pushes with GITHUB_TOKEN start no workflows, so this commit applies nothing.
      - if: always() && steps.apply.outcome != 'skipped'
        run: |
          state=tofu/stacks/${STACK}/terraform.tfstate
          git add "$state"
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "chore(tofu): update ${STACK} state" -m "Applied from ${GITHUB_SHA}."
          # Applies of other stacks push too; rebase onto them and retry.
          for _ in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
        # The rebase rewrites the commit, so it needs the identity too.
        env:
          STACK: ${{ matrix.stack }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      - if: always()
        run: task tailscale:down
