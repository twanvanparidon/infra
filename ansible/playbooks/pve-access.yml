# Create the Proxmox pool, roles, users, API tokens and ACLs that OpenTofu uses,
# let the `local` storage hold downloaded disk images (`import` content), and
# create the `images` storage, where tofu may also delete the images it downloaded.
# Run once from a laptop: `task pve:access`. Re-running changes nothing; a new
# token's secret is shown only when it is created. The dev token goes into
# secrets/proxmox.sops.yaml; the CI token is printed to store as a GitHub secret.
# To rotate a token, remove it (`pveum user token remove <user> <token>`) and re-run.
- name: Set up Proxmox access for OpenTofu
  hosts: pve
  vars:
    pool: tofu
    storage: local-lvm
    # Where Proxmox downloads image releases before they become templates.
    image_storage: local
    # Talos images; tofu replaces them on every version or schematic change.
    managed_image_storage: images
    managed_image_path: /var/lib/images
    # Built-in roles grant too much or too little for these.
    custom_roles:
      # Download images to a storage and use them as VM disks.
      - id: TofuImages
        privs: Datastore.AllocateTemplate,Datastore.Audit
      # The same, plus deleting them again; only on the images storage.
      - id: TofuManagedImages
        privs: Datastore.Allocate,Datastore.AllocateTemplate,Datastore.Audit
      # download-url and query-url-metadata let the node fetch URLs, so they
      # need Sys.AccessNetwork on the node (or Sys.Modify on /).
      - id: TofuDownload
        privs: Sys.AccessNetwork
      # Plans refresh VM disks, and Proxmox only shows a VM's disk volume to
      # users with VM.Config.Disk on that VM; no read-only privilege does.
      - id: TofuPlan
        privs: VM.Config.Disk
    secret_file: "{{ playbook_dir }}/../../secrets/proxmox.sops.yaml"
    # Tokens are privilege separated: each gets the same ACLs as its user.
    users:
      - id: tofu-dev@pve
        token: dev
        comment: For plans, from a laptop and pull requests
        acls:
          - { path: /, role: PVEAuditor }
          # An ACL on a path replaces the roles inherited from /, so the pool
          # needs PVEAuditor again next to TofuPlan.
          - { path: "/pool/{{ pool }}", role: PVEAuditor }
          - { path: "/pool/{{ pool }}", role: TofuPlan }
      - id: tofu-ci@pve
        token: ci
        comment: Plans and applies from CI
        acls:
          # VMs in the pool; PVEPoolAdmin adds new VMs to it.
          - { path: "/pool/{{ pool }}", role: PVEVMAdmin }
          - { path: "/pool/{{ pool }}", role: PVEPoolAdmin }
          - { path: "/storage/{{ storage }}", role: PVEDatastoreUser }
          # Attach VMs to the node's Linux bridges.
          - { path: /sdn/zones/localnetwork, role: PVESDNUser }
          - { path: "/nodes/{{ ansible_facts['hostname'] }}", role: PVEAuditor }
          - { path: "/storage/{{ image_storage }}", role: TofuImages }
          - { path: "/storage/{{ managed_image_storage }}", role: TofuManagedImages }
          - { path: "/nodes/{{ ansible_facts['hostname'] }}", role: TofuDownload }

  tasks:
    - name: Read pools, users, ACLs and roles
      ansible.builtin.command: pveum {{ item }} list --output-format json
      loop: [pool, user, acl, role]
      register: current
      changed_when: false

    - name: Keep the current state
      ansible.builtin.set_fact:
        pools: "{{ current.results[0].stdout | from_json | map(attribute='poolid') }}"
        existing_users: "{{ current.results[1].stdout | from_json | map(attribute='userid') }}"
        acls: "{{ current.results[2].stdout | from_json }}"
        existing_roles: "{{ current.results[3].stdout | from_json | items2dict(key_name='roleid', value_name='privs') }}"

    - name: Create the pool
      ansible.builtin.command: pveum pool add {{ pool }} --comment "Managed by OpenTofu"
      when: pool not in pools
      changed_when: true

    - name: Read the image storage
      ansible.builtin.command: pvesh get /storage/{{ image_storage }} --output-format json
      register: image_storage_config
      changed_when: false

    - name: Allow disk images on the image storage
      ansible.builtin.command: pvesm set {{ image_storage }} --content {{ (content + ['import']) | join(',') }}
      vars:
        content: "{{ (image_storage_config.stdout | from_json).content.split(',') }}"
      when: "'import' not in content"
      changed_when: true

    - name: Read the storages
      ansible.builtin.command: pvesh get /storage --output-format json
      register: storages
      changed_when: false

    - name: Create the managed image storage
      ansible.builtin.command: >-
        pvesm add dir {{ managed_image_storage }} --path {{ managed_image_path }}
        --content import --mkdir 1
      when: managed_image_storage not in (storages.stdout | from_json | map(attribute='storage'))
      changed_when: true

    - name: Create the roles
      ansible.builtin.command: pveum role add {{ item.id }} --privs {{ item.privs }}
      loop: "{{ custom_roles }}"
      loop_control:
        label: "{{ item.id }}"
      when: item.id not in existing_roles
      changed_when: true

    - name: Update roles whose privileges changed
      ansible.builtin.command: pveum role modify {{ item.id }} --privs {{ item.privs }}
      loop: "{{ custom_roles }}"
      loop_control:
        label: "{{ item.id }}"
      when: >-
        item.id in existing_roles and
        (existing_roles[item.id].split(',') | sort) != (item.privs.split(',') | sort)
      changed_when: true

    - name: Create the users
      ansible.builtin.command: pveum user add {{ item.id }} --comment "{{ item.comment }}"
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.id }}"
      when: item.id not in existing_users
      changed_when: true

    - name: Read the tokens
      ansible.builtin.command: pveum user token list {{ item.id }} --output-format json
      loop: "{{ users }}"
      loop_control:
        label: "{{ item.id }}"
      register: tokens
      changed_when: false

    - name: Create the tokens
      ansible.builtin.command: >-
        pveum user token add {{ item.item.id }} {{ item.item.token }}
        --privsep 1 --comment "{{ item.item.comment }}" --output-format json
      loop: "{{ tokens.results }}"
      loop_control:
        label: "{{ item.item.id }}!{{ item.item.token }}"
      when: item.item.token not in (item.stdout | from_json | map(attribute='tokenid'))
      register: created
      changed_when: true
      no_log: true

    - name: Grant the ACLs to each user and its token
      ansible.builtin.command: >-
        pveum acl modify {{ item.1.path }} --roles {{ item.1.role }}
        --{{ 'users' if kind == 'user' else 'tokens' }} {{ ugid }}
      loop: "{{ users | subelements('acls') | product(['user', 'token']) | map('flatten') }}"
      loop_control:
        label: "{{ ugid }} {{ item.1.role }} {{ item.1.path }}"
      vars:
        kind: "{{ item.2 }}"
        ugid: "{{ item.0.id if kind == 'user' else item.0.id ~ '!' ~ item.0.token }}"
      when: >-
        acls | selectattr('path', 'equalto', item.1.path)
        | selectattr('roleid', 'equalto', item.1.role)
        | selectattr('ugid', 'equalto', ugid) | length == 0
      changed_when: true

    - name: Store the new dev token in sops
      ansible.builtin.command:
        cmd: sops set --value-stdin {{ secret_file }} '["api_token"]'
        stdin: "{{ ('tofu-dev@pve!dev=' ~ (item.stdout | from_json).value) | to_json }}"
      loop: "{{ created.results | selectattr('changed', 'defined') | selectattr('changed') | selectattr('item.item.token', 'equalto', 'dev') }}"
      loop_control:
        label: tofu-dev@pve!dev
      delegate_to: localhost
      become: false
      changed_when: true
      no_log: true

    - name: Show the new CI token once
      ansible.builtin.debug:
        msg:
          - "tofu-ci@pve!ci={{ (item.stdout | from_json).value }}"
          - Store it as the PROXMOX_VE_API_TOKEN secret of the proxmox-apply environment; it is not shown again.
      loop: "{{ created.results | selectattr('changed', 'defined') | selectattr('changed') | selectattr('item.item.token', 'equalto', 'ci') }}"
      loop_control:
        label: tofu-ci@pve!ci
