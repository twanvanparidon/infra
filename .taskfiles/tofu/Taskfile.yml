# Run OpenTofu on one stack under tofu/stacks (STACK=name).
# Every task decrypts the state passphrase from secrets/tofu.sops.yaml into
# TF_ENCRYPTION; the stack code holds the method and enforces it. The Proxmox
# token is PROXMOX_VE_API_TOKEN when set (CI apply), else the plan-only dev
# token from secrets/proxmox.sops.yaml.
# A stack with a .ci-skip file (its content says why) is left out of
# tofu:stacks and tofu:changed, so CI does not plan, apply or check it.
version: "3"

silent: true

vars:
  SECRET: secrets/tofu.sops.yaml
  PROXMOX_SECRET: secrets/proxmox.sops.yaml

tasks:
  init:
    desc: tofu init a stack (STACK=name)
    requires:
      vars: [STACK]
    env: &encryption
      TF_ENCRYPTION:
        sh: printf 'key_provider "pbkdf2" "main" { passphrase = "%s" }' "$(sops decrypt --extract '["passphrase"]' {{.SECRET}})"
      PROXMOX_VE_API_TOKEN:
        sh: printf '%s' "${PROXMOX_VE_API_TOKEN:-$(sops decrypt --extract '["api_token"]' {{.PROXMOX_SECRET}})}"
    cmds:
      - tofu -chdir=tofu/stacks/{{.STACK}} init -input=false

  plan:
    desc: tofu plan a stack (STACK=name); extra flags after --
    requires:
      vars: [STACK]
    env: *encryption
    cmds:
      # Only errors from init; the output is the plan.
      - tofu -chdir=tofu/stacks/{{.STACK}} init -input=false > /dev/null
      - tofu -chdir=tofu/stacks/{{.STACK}} plan -input=false {{.CLI_ARGS}}

  output:
    desc: Print an output of a stack (STACK=name); extra flags after --, e.g. -- -raw kubeconfig
    requires:
      vars: [STACK]
    env: *encryption
    cmds:
      - tofu -chdir=tofu/stacks/{{.STACK}} init -input=false > /dev/null
      - tofu -chdir=tofu/stacks/{{.STACK}} output {{.CLI_ARGS}}

  apply:
    desc: tofu apply a stack without asking (STACK=name); CI runs this on main
    requires:
      vars: [STACK]
    env: *encryption
    cmds:
      - tofu -chdir=tofu/stacks/{{.STACK}} init -input=false > /dev/null
      # Apply only when the plan has changes: every apply rewrites and
      # re-encrypts the state, which would make a state commit for nothing.
      - |
        rc=0
        tofu -chdir=tofu/stacks/{{.STACK}} plan -input=false -detailed-exitcode -out=apply.tfplan || rc=$?
        case "$rc" in
          0) echo "no changes, nothing to apply" ;;
          2) tofu -chdir=tofu/stacks/{{.STACK}} apply -input=false apply.tfplan ;;
          *) exit "$rc" ;;
        esac
        rm -f tofu/stacks/{{.STACK}}/apply.tfplan

  stacks:
    desc: Print every stack as a JSON list
    cmds:
      - |
        out=""
        for d in tofu/stacks/*/; do
          s="$(basename "$d")"
          ls "$d"*.tf > /dev/null 2>&1 || continue
          if [ -f "$d.ci-skip" ]; then echo "skip $s: $(cat "$d.ci-skip")" >&2; continue; fi
          out="$out${out:+,}\"$s\""
        done
        echo "[$out]"

  changed:
    desc: Print the stacks changed since BASE (default origin/main) as a JSON list
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - |
        files="$(git diff --name-only "{{.BASE}}...HEAD")"
        # Shared code and secrets affect every stack.
        if printf '%s\n' "$files" | grep -qE '^(tofu/modules/|tofu/shared/|secrets/(tofu|proxmox)\.sops\.yaml$|\.taskfiles/tofu/Taskfile\.yml$|\.github/workflows/tofu\.yml$)'; then
          stacks="$(ls tofu/stacks)"
        else
          # State commits from CI are not changes to apply.
          stacks="$(printf '%s\n' "$files" | grep -v '/terraform\.tfstate$' | sed -n 's|^tofu/stacks/\([^/]*\)/.*|\1|p' | sort -u)"
        fi
        out=""
        for s in $stacks; do
          # Skip stacks the change deleted.
          ls tofu/stacks/"$s"/*.tf > /dev/null 2>&1 || continue
          if [ -f "tofu/stacks/$s/.ci-skip" ]; then echo "skip $s: $(cat "tofu/stacks/$s/.ci-skip")" >&2; continue; fi
          out="$out${out:+,}\"$s\""
        done
        echo "[$out]"
