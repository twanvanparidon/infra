# Join the tailnet from a CI job container. tailscaled runs in kernel mode and
# creates tailscale0 with a route for the subnet, so the job reaches Proxmox
# directly. The container needs root, NET_ADMIN and /dev/net/tun. Userspace
# mode does not work here: its proxy dials subnet routes outside the tunnel.
# All Tailscale output goes to /dev/null: tailscaled logs peer endpoints, which
# include the home IP, and workflow logs are public.
version: '3'

silent: true

vars:
  VERSION: 1.104.1
  # https://pkgs.tailscale.com/stable/tailscale_<VERSION>_amd64.tgz.sha256
  SHA256: 108d1d96ecf410d305571e173516f27038f870919a9b89c914a167c6d33a4528
  DIR: /tmp/tailscale
  TS: '{{.DIR}}/tailscale --socket={{.DIR}}/tailscaled.sock'

tasks:
  up:
    desc: Join the tailnet as an ephemeral tag:ci node (CI only; needs TS_CLIENT_SECRET).
    preconditions:
      - sh: test -n "$TS_CLIENT_SECRET"
        msg: TS_CLIENT_SECRET is not set
    cmds:
      - |
        mkdir -p {{.DIR}}
        wget -q -O {{.DIR}}/tailscale.tgz https://pkgs.tailscale.com/stable/tailscale_{{.VERSION}}_amd64.tgz
        echo "{{.SHA256}}  {{.DIR}}/tailscale.tgz" | sha256sum -c -s
        tar -xzf {{.DIR}}/tailscale.tgz -C {{.DIR}} --strip-components=1
        nohup {{.DIR}}/tailscaled --state=mem: --socket={{.DIR}}/tailscaled.sock \
          --no-logs-no-support > /dev/null 2>&1 &
        sleep 2
        if ! {{.TS}} up --client-secret="$TS_CLIENT_SECRET?preauthorized=true" \
          --advertise-tags=tag:ci --accept-routes --accept-dns=false --netfilter-mode=off \
          --hostname="ci-${GITHUB_RUN_ID:-local}" \
          --timeout=60s > /dev/null 2>&1; then
          echo "tailscale up failed; output is hidden because it can contain the home IP" >&2
          exit 1
        fi
        echo "joined the tailnet as tag:ci"

  route:
    desc: Say whether a subnet router for ROUTE (default 10.0.10.0/24) is visible and online; prints no addresses.
    vars:
      ROUTE: '{{.ROUTE | default "10.0.10.0/24"}}'
    cmds:
      - |
        status="$({{.TS}} status --json)"
        online="$(printf '%s' "$status" | jq -r --arg r "{{.ROUTE}}" '[.Peer[] | select((.PrimaryRoutes // []) | index($r)) | .Online] | if length == 0 then "none" else (.[0] | tostring) end')"
        accepted="$(printf '%s' "$status" | jq -r --arg r "{{.ROUTE}}" '[.Peer[] | select((.AllowedIPs // []) | index($r))] | length > 0')"
        echo "subnet router for {{.ROUTE}}: online=$online accepted=$accepted"
        [ "$online" = "true" ] && [ "$accepted" = "true" ]

  ping:
    desc: Ping the subnet router for ROUTE through the tunnel; prints only the verdict, never addresses.
    vars:
      ROUTE: '{{.ROUTE | default "10.0.10.0/24"}}'
    cmds:
      - |
        gw="$({{.TS}} status --json | jq -r --arg r "{{.ROUTE}}" '[.Peer[] | select((.PrimaryRoutes // []) | index($r)) | .TailscaleIPs[0]][0] // empty')"
        [ -n "$gw" ] || { echo "no subnet router for {{.ROUTE}}"; exit 1; }
        for mode in disco tsmp; do
          flag=""; [ "$mode" = tsmp ] && flag="--tsmp"
          out="$({{.TS}} ping $flag -c 5 --timeout 5s "$gw" 2>&1 || true)"
          case "$out" in
            *"via DERP"*) echo "$mode ping: pong via DERP" ;;
            *pong*) echo "$mode ping: pong" ;;
            *) echo "$mode ping: no pong" ;;
          esac
        done

  down:
    desc: Leave the tailnet; the ephemeral node is removed right away.
    cmds:
      - '{{.TS}} logout > /dev/null 2>&1 || true'
