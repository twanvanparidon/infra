version: '3'

silent: true

tasks:
  setup:
    desc: 'Set up gateway01 as subnet router and SSH bastion; first run: `pbpaste | task gateway:setup`'
    dir: ansible
    env:
      # The auth key comes from stdin, so it stays out of shell history.
      TS_AUTHKEY:
        sh: '[ -t 0 ] || cat'
    cmds:
      - ansible-playbook playbooks/gateway.yml
