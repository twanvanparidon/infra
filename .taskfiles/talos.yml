version: '3'

silent: true

tasks:
  schematic:
    desc: Print the image factory schematic ID of talos/schematic.yaml, for talos_schematic in tofu/stacks/pve-prod/talos.tf
    cmds:
      - curl -sSf -X POST --data-binary @talos/schematic.yaml https://factory.talos.dev/schematics | yq -p json -r .id
